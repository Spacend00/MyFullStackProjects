version: '3.8'

services:
  backend-api:
    container_name: equasolve_backend
    build: 
      context: ./MathAPI/EquaSolve
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend-angular:
    container_name: equasolve_frontend
    build: 
      context: ./MathAngular/EquaSolverAng
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend-api